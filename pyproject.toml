[project]
name = "clausifier"
version = "0.1.0"
description = "Clasifica noticias (TEMA y TONO) de un xlsx para un cliente y compara su cobertura en 5 portales colombianos"
requires-python = ">=3.10"
dependencies = [
    # Versión verificada del SDK: 0.2.176 (empaca Claude Code 2.1.316).
    # El paquete trae el binario `claude` adentro: no hay que instalar nada más.
    "claude-agent-sdk>=0.2.170",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "streamlit>=1.40",
]

[tool.uv]
package = false
