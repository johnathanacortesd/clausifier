# Tema claro, cálido y sobrio (crema + terracota), estilo terminal de Claude Code.
[theme]
base = "light"
primaryColor = "#D97757"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#F0EEE6"
textColor = "#141413"
borderColor = "#E3DFD3"
font = "sans-serif"
codeFont = "monospace"
baseRadius = "0.5rem"

[client]
toolbarMode = "minimal"
